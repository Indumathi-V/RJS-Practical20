name: Program 20 - Autograding

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autograding:
    name: Validate Nested Blog Routes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout student repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check required files
        run: |
          test -f src/App.js
          test -f src/App.test.js
          test -f src/components/BlogLayout.js
          test -f src/pages/Home.js
          test -f src/pages/Blog.js
          test -f src/pages/Post1.js
          test -f src/pages/Post2.js
          test -f src/pages/Post3.js
          test -f src/index.js
          test -f src/index.css
          test -f public/index.html

      - name: Check parent and nested route structure
        run: |
          grep -q "BrowserRouter" src/App.js
          grep -q "Routes" src/App.js
          grep -q "Route" src/App.js
          grep -q 'path="/blog"' src/App.js
          grep -q 'path="post1"' src/App.js
          grep -q 'path="post2"' src/App.js
          grep -q 'path="post3"' src/App.js

      - name: Check nested route outlet and navigation
        run: |
          grep -q "Outlet" src/components/BlogLayout.js
          grep -q "Link" src/components/BlogLayout.js
          grep -q "Link" src/pages/Blog.js

      - name: Run test cases
        run: CI=true npm test -- --watchAll=false

      - name: Build application
        run: npm run build
